# Build config for the AP Tech Hub Android app (Trusted Web Activity).
#
# Anything here can be overridden per build without editing the file, e.g.
#   gradle bundleRelease -PversionCode=7 -PversionName=1.0.6
# which is how the release workflow bumps versions.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Play Store identity. Changing applicationId after publishing creates a
# separate listing, so this is fixed for the life of the app.
apApplicationId=com.aptechagency.hub

# Bump versionCode for every upload to Play; duplicates are rejected.
apVersionCode=1
apVersionName=1.0.0

# The site the app opens. Must be HTTPS and must serve
# /.well-known/assetlinks.json matching this app's signing certificate,
# otherwise Chrome keeps a URL bar visible over the app.
apLaunchUrl=https://aptechagency.com/
apHostName=aptechagency.com
