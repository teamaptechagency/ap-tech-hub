<!doctype html><html><head><meta charset="utf-8"><title>AP Tech Work Tracker</title><style>body{font:14px Arial;background:#101620;color:#edf3f7;width:360px;padding:20px}input{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 14px}button{padding:10px;margin:6px 6px 6px 0;cursor:pointer}label{display:block}p{line-height:1.5}.notice{color:#a8bdce}input[type=checkbox]{width:auto}</style></head><body><h2>AP Tech Work Tracker</h2><p class="notice">This visible extension counts refreshes, navigation, clicks and keyboard interactions only on Fiverr, Upwork and Freelancer. It never reads typed text, messages, passwords, clipboard contents or full URLs. The Windows app is controlled separately.</p><label>Exact PC name shown in Windows app<input id="pc" maxlength="80"></label><label>Device credential<input id="token" type="password" autocomplete="off"></label><label><input id="consent" type="checkbox"> I understand and agree to this work session.</label><button id="start">Enable work tracking</button><button id="pause">Pause</button><p id="status" role="status">Paused</p><script src="options.js"></script></body></html>
