name: Publish Android app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease -PapVersionName=1.1.0 -PapVersionCode=2 -PapLaunchUrl=https://www.aptechagency.com/hub-app -PapHostName=www.aptechagency.com
      - name: Verify and publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/APTechHub-1.1.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/APTechHub-1.1.0.aab
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APK_SIGNER" verify release/APTechHub-1.1.0.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
          gh release create android-v1.1.0 release/* --title "AP Tech Hub Android 1.1.0" --notes "Role-based jobs, project progress, support chat and referral earnings. Same website login. Android Chrome required for the Trusted Web Activity."
